name: release

# Tags are the only trigger: a release is cut by pushing v1.2.3, and the tag it
# was cut from is the version the archives are named after.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          # Pure Go, so every target cross-compiles from this one runner.
          # CGO stays off to keep the Linux builds free of a glibc floor.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            name=forecastui_${version}_${os}_${arch}

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags '-s -w' -o "dist/forecastui$ext" ./cmd/forecastui

            # The archive holds the bare binary and nothing else, which is what
            # the install scripts expect to find inside it.
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" forecastui.exe)
            else
              tar -czf "dist/$name.tar.gz" -C dist forecastui
            fi
            rm -f "dist/forecastui$ext"
          done
          (cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS)
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
